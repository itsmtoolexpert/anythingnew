<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Helvetica, Arial, sans-serif">
<style>
  .bg{fill:#FAF8F3}
  .t{fill:#14161A}
  .m{fill:#4A4F57}
  .row{fill:#FFFFFF;stroke:#C9CDD3;stroke-width:2}
  .act{fill:#14161A}
  .rec{fill:#FFF4E5;stroke:#C2410C;stroke-width:3;stroke-dasharray:10 8}
  .spine{stroke:#C9CDD3;stroke-width:4}
  .tok{fill:#1D4ED8}
  @keyframes mv{0%{transform:translateY(0)}5%{transform:translateY(0)}13%{transform:translateY(150px)}18%{transform:translateY(150px)}26%{transform:translateY(300px)}31%{transform:translateY(300px)}39%{transform:translateY(450px)}44%{transform:translateY(450px)}52%{transform:translateY(600px)}100%{transform:translateY(600px)}}
  #tok{animation:mv 10s ease-in-out infinite}
  @keyframes r1{0%,10%{stroke:#C9CDD3;fill:#FFFFFF}12%,92%{stroke:#1D4ED8;fill:#EEF3FF}96%,100%{stroke:#C9CDD3;fill:#FFFFFF}}
  @keyframes r2{0%,23%{stroke:#C9CDD3;fill:#FFFFFF}25%,92%{stroke:#15803D;fill:#ECFDF3}96%,100%{stroke:#C9CDD3;fill:#FFFFFF}}
  @keyframes r3{0%,36%{stroke:#C9CDD3;fill:#FFFFFF}38%,92%{stroke:#7C3AED;fill:#F5F0FF}96%,100%{stroke:#C9CDD3;fill:#FFFFFF}}
  @keyframes r4{0%,49%{stroke:#C9CDD3;fill:#FFFFFF}51%,92%{stroke:#B91C1C;fill:#FEF2F2}96%,100%{stroke:#C9CDD3;fill:#FFFFFF}}
  #r1{animation:r1 10s linear infinite}
  #r2{animation:r2 10s linear infinite}
  #r3{animation:r3 10s linear infinite}
  #r4{animation:r4 10s linear infinite}
  @keyframes ck{0%,8%{opacity:0}10%,92%{opacity:1}96%,100%{opacity:0}}
  .c1{animation:ck 10s linear infinite}
  .c2{animation:ck 10s linear infinite;animation-delay:1.3s}
  .c3{animation:ck 10s linear infinite;animation-delay:2.6s}
  .c4{animation:ck 10s linear infinite;animation-delay:3.9s}
  @keyframes rb{0%,58%{fill:#FFF4E5}64%,92%{fill:#FFE4C7}100%{fill:#FFF4E5}}
  .rec{animation:rb 10s linear infinite}
  @keyframes q{0%,60%{opacity:0}64%,94%{opacity:1}100%{opacity:0}}
  .q{animation:q 10s linear infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .actbox{animation:pulse 2.5s ease-in-out infinite}
</style>
<rect class="bg" width="1080" height="1350"/>
<text class="t" x="50" y="100" font-size="50" font-weight="700">One agent action.</text>
<text class="t" x="50" y="158" font-size="50" font-weight="700">Four records. No change ticket.</text>
<text class="m" x="50" y="202" font-size="22">Who writes down what an IT agent did, as of Nov 25, 2026</text>

<rect class="act actbox" x="50" y="230" width="980" height="86" rx="16"/>
<text x="90" y="284" font-size="30" font-weight="700" fill="#FFFFFF">⚙ Agent runs a tool call in production</text>

<line class="spine" x1="90" y1="316" x2="90" y2="1000"/>
<circle id="tok" class="tok" cx="90" cy="400" r="16"/>

<!-- Row 1: trace -->
<rect id="r1" class="row" x="130" y="345" width="900" height="120" rx="14"/>
<text class="t" x="160" y="388" font-size="28" font-weight="700">1 · The trace</text>
<text class="m" x="160" y="422" font-size="21">Observability: Azure Monitor (GA, Nov 17), BigQuery</text>
<text class="m" x="160" y="450" font-size="21">agent_events table you own (Nov 13)</text>
<text class="c1" x="975" y="410" font-size="36" fill="#1D4ED8" font-weight="700">✓</text>

<!-- Row 2: approval -->
<rect id="r2" class="row" x="130" y="495" width="900" height="120" rx="14"/>
<text class="t" x="160" y="538" font-size="28" font-weight="700">2 · The approval</text>
<text class="m" x="160" y="572" font-size="21">Gate tool: LangSmith Tool Gateway policy, Databricks</text>
<text class="m" x="160" y="600" font-size="21">ZeroOps pull request (both Nov 19)</text>
<text class="c2" x="975" y="560" font-size="36" fill="#15803D" font-weight="700">✓</text>

<!-- Row 3: misuse flag -->
<rect id="r3" class="row" x="130" y="645" width="900" height="120" rx="14"/>
<text class="t" x="160" y="688" font-size="28" font-weight="700">3 · The misuse flag  <tspan fill="#7C3AED">NEW</tspan></text>
<text class="m" x="160" y="722" font-size="21">Model provider: Anthropic Enterprise Frontier Safeguards</text>
<text class="m" x="160" y="750" font-size="21">beta (Nov 23), sealed in your cloud, your team reviews</text>
<text class="c3" x="975" y="710" font-size="36" fill="#7C3AED" font-weight="700">✓</text>

<!-- Row 4: kill switch inventory -->
<rect id="r4" class="row" x="130" y="795" width="900" height="120" rx="14"/>
<text class="t" x="160" y="838" font-size="28" font-weight="700">4 · The kill-switch inventory</text>
<text class="m" x="160" y="872" font-size="21">Security: US banks want kill switches that find the</text>
<text class="m" x="160" y="900" font-size="21">processes an agent created (Reuters, Nov 23)</text>
<text class="c4" x="975" y="860" font-size="36" fill="#B91C1C" font-weight="700">✓</text>

<!-- Row 5: change record -->
<rect class="rec" x="130" y="945" width="900" height="130" rx="14"/>
<text class="t" x="160" y="990" font-size="28" font-weight="700">5 · The change record</text>
<text class="m" x="160" y="1024" font-size="21">ITSM / CMDB: what changed, who approved, how to undo.</text>
<text class="m" x="160" y="1052" font-size="21">No vendor writes this one from the agent yet.</text>
<text class="q" x="960" y="1028" font-size="56" fill="#C2410C" font-weight="700">?</text>

<line x1="50" y1="1120" x2="1030" y2="1120" stroke="#C9CDD3" stroke-width="2"/>
<text class="t" x="50" y="1170" font-size="27" font-weight="700">Every layer now keeps its own agent record,</text>
<text class="t" x="50" y="1208" font-size="27" font-weight="700">even the model provider. The one that answers</text>
<text class="t" x="50" y="1246" font-size="27" font-weight="700">“what changed?” is still unwritten.</text>
<text class="m" x="50" y="1310" font-size="20">Emerging Things · Rahul Adokar</text>
</svg>
