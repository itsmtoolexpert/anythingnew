<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Helvetica,Arial,sans-serif">
<style>
  .t{fill:#1a1a1a}
  .m{fill:#555}
  .bar{transform-box:fill-box;transform-origin:left center;animation:grow 10s infinite ease-out}
  .b1{animation-delay:0s}
  .b2{animation-delay:.6s}
  .b3{animation-delay:1.2s}
  .b4{animation-delay:1.8s}
  @keyframes grow{0%{transform:scaleX(0)}12%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .lbl{animation:fade 10s infinite}
  .l1{animation-delay:.3s}.l2{animation-delay:.9s}.l3{animation-delay:1.5s}.l4{animation-delay:2.1s}
  @keyframes fade{0%,4%{opacity:0}12%,92%{opacity:1}100%{opacity:0}}
  .step{fill:#fff;stroke:#1F3A5F;stroke-width:3}
  .s1{animation:lit 10s infinite;animation-delay:-6s}
  .s2{animation:lit2 10s infinite;animation-delay:-4.5s}
  .s3{animation:lit 10s infinite;animation-delay:-2.5s}
  .s4{animation:lit 10s infinite;animation-delay:-1s}
  @keyframes lit{0%,2%{fill:#fff}6%,16%{fill:#FFE9A8}22%,100%{fill:#fff}}
  @keyframes lit2{0%,2%{fill:#fff}6%,26%{fill:#FFD3BF}32%,100%{fill:#fff}}
  .flow{stroke:#9aa5b1;stroke-width:4;stroke-dasharray:10 10;fill:none;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-20}}
</style>
<rect width="1080" height="1350" fill="#F7F5F0"/>

<text x="60" y="100" font-size="52" font-weight="700" class="t">87% use AI agents in IT ops.</text>
<text x="60" y="162" font-size="52" font-weight="700" class="t">12% let them run.</text>
<text x="60" y="206" font-size="22" class="m">Dynatrace State of Observability 2026 · 1,202 tech leaders, 12 countries · Aug 2026 survey</text>

<!-- Bars -->
<g>
  <text x="60" y="262" font-size="22" font-weight="700" fill="#1F3A5F">THE AUTONOMY GAP</text>

  <rect x="60" y="282" width="960" height="70" rx="10" fill="#E6E2D8"/>
  <rect x="60" y="282" width="835" height="70" rx="10" fill="#1F3A5F" class="bar b1"/>
  <text x="84" y="328" font-size="30" font-weight="700" fill="#fff" class="lbl l1">87%  use AI agents for observability &amp; IT ops</text>

  <rect x="60" y="372" width="960" height="70" rx="10" fill="#E6E2D8"/>
  <rect x="60" y="372" width="422" height="70" rx="10" fill="none" stroke="#1F3A5F" stroke-width="4" stroke-dasharray="12 8" class="bar b2"/>
  <text x="500" y="418" font-size="28" font-weight="700" fill="#1F3A5F" class="lbl l2">44%  target full autonomy in 5 yrs</text>

  <rect x="60" y="462" width="960" height="70" rx="10" fill="#E6E2D8"/>
  <rect x="60" y="462" width="259" height="70" rx="10" fill="#5C7A99" class="bar b3"/>
  <text x="340" y="508" font-size="28" font-weight="700" class="t lbl l3">27%  address how agents decide &amp; act</text>

  <rect x="60" y="552" width="960" height="70" rx="10" fill="#E6E2D8"/>
  <rect x="60" y="552" width="115" height="70" rx="10" fill="#D9480F" class="bar b4"/>
  <text x="196" y="598" font-size="28" font-weight="700" class="t lbl l4">12%  fully autonomous operations today</text>
</g>

<!-- Loop -->
<text x="60" y="690" font-size="22" font-weight="700" fill="#1F3A5F">WHAT SITS IN THE GAP: THE HUMAN "YES"</text>

<rect x="60" y="715" width="290" height="130" rx="16" class="step s1"/>
<text x="205" y="770" font-size="28" font-weight="700" class="t" text-anchor="middle">Agent</text>
<text x="205" y="808" font-size="24" class="m" text-anchor="middle">proposes action</text>

<rect x="395" y="715" width="290" height="130" rx="16" class="step s2" stroke="#D9480F"/>
<text x="540" y="765" font-size="28" font-weight="700" class="t" text-anchor="middle">Human verifies</text>
<text x="540" y="806" font-size="34" font-weight="700" fill="#D9480F" text-anchor="middle">66%</text>
<text x="540" y="834" font-size="20" class="m" text-anchor="middle">of AI decisions (avg)</text>

<rect x="730" y="715" width="290" height="130" rx="16" class="step s3"/>
<text x="875" y="770" font-size="28" font-weight="700" class="t" text-anchor="middle">Action</text>
<text x="875" y="808" font-size="24" class="m" text-anchor="middle">runs in production</text>

<rect x="235" y="925" width="610" height="120" rx="16" class="step s4"/>
<text x="540" y="975" font-size="28" font-weight="700" class="t" text-anchor="middle">Trace + approval record</text>
<text x="540" y="1014" font-size="22" class="m" text-anchor="middle">observability shows why · ITSM records who said yes</text>

<path id="loop" class="flow" d="M350 780 L395 780 M685 780 L730 780"/>
<path class="flow" d="M875 845 L875 985 L845 985"/>
<path fill="none" stroke="#D9480F" stroke-opacity=".25" stroke-width="3" d="M205 878 L875 878 L875 1066 L205 1066 Z"/>
<path class="flow" d="M235 985 L205 985 L205 845"/>
<path id="track" fill="none" stroke="none" d="M205 878 L540 878 L875 878 L875 1066 L540 1066 L205 1066 L205 878"/>
<circle r="13" fill="#D9480F">
  <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0.22;0.22;0.44;0.72;1" keyTimes="0;0.15;0.40;0.55;0.85;1" calcMode="linear">
    <mpath href="#track"/>
  </animateMotion>
</circle>

<!-- Thesis -->
<rect x="60" y="1090" width="960" height="140" rx="18" fill="#1F3A5F"/>
<text x="90" y="1145" font-size="30" font-weight="700" fill="#fff">The autonomy gap is a verification gap.</text>
<text x="90" y="1192" font-size="26" fill="#fff">Record the human "yes" and you can automate it next.</text>

<text x="60" y="1282" font-size="20" class="m">Source: Dynatrace State of Observability 2026 (Nov 2026). Self-reported survey.</text>
<text x="60" y="1318" font-size="22" font-weight="700" class="t">Emerging Things · Rahul Adokar</text>
</svg>
