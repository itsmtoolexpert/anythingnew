<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Helvetica, Arial, sans-serif">
<rect width="1080" height="1350" fill="#f7f5ef"/>
<text x="540" y="95" font-size="54" font-weight="700" fill="#14213d" text-anchor="middle">Who owns the agent trace?</text>
<text x="540" y="140" font-size="26" fill="#44506b" text-anchor="middle">The agent control loop, as vendors are filling it</text>

<!-- connectors -->
<g stroke="#9aa3b5" stroke-width="5" fill="none">
<path d="M540 330 V400"/><path d="M540 590 V660"/><path d="M540 850 V920"/>
<path d="M900 1010 H990 V240 H900" stroke-dasharray="12 10"/>
</g>
<text x="1010" y="640" font-size="22" fill="#44506b" transform="rotate(90 1010 640)" text-anchor="middle">feedback: tighter policy</text>

<!-- stage boxes -->
<g>
<rect x="120" y="150" width="780" height="180" rx="22" fill="#e7ebf5" stroke="#14213d" stroke-width="3">
<animate attributeName="fill" values="#e7ebf5;#ffd166;#e7ebf5;#e7ebf5" keyTimes="0;0.05;0.25;1" dur="10s" repeatCount="indefinite"/></rect>
<text x="150" y="205" font-size="34" font-weight="700" fill="#14213d">1  POLICY</text>
<text x="150" y="250" font-size="24" fill="#14213d">ServiceNow AI Passport + AI Control Tower</text>
<text x="150" y="288" font-size="22" fill="#44506b">Policy enforced at runtime with NVIDIA (Oct 21)</text>

<rect x="120" y="400" width="780" height="190" rx="22" fill="#e7ebf5" stroke="#14213d" stroke-width="3">
<animate attributeName="fill" values="#e7ebf5;#e7ebf5;#ffd166;#e7ebf5;#e7ebf5" keyTimes="0;0.22;0.3;0.48;1" dur="10s" repeatCount="indefinite"/></rect>
<text x="150" y="455" font-size="34" font-weight="700" fill="#14213d">2  AGENT ACTS</text>
<text x="150" y="500" font-size="24" fill="#14213d">Coding agents and IT-ops agents call tools</text>
<text x="150" y="538" font-size="22" fill="#44506b">Digitate ignio: built-in MCP + A2A servers (Oct 28)</text>

<rect x="120" y="660" width="780" height="190" rx="22" fill="#e7ebf5" stroke="#14213d" stroke-width="3">
<animate attributeName="fill" values="#e7ebf5;#e7ebf5;#ffd166;#e7ebf5;#e7ebf5" keyTimes="0;0.45;0.53;0.72;1" dur="10s" repeatCount="indefinite"/></rect>
<text x="150" y="715" font-size="34" font-weight="700" fill="#14213d">3  TRACE</text>
<text x="150" y="760" font-size="24" fill="#14213d">Dynatrace: 1,100+ customers in agents preview</text>
<text x="150" y="798" font-size="22" fill="#44506b">CrowdStrike to acquire Fiddler (Nov 3)</text>

<rect x="120" y="920" width="780" height="180" rx="22" fill="#e7ebf5" stroke="#14213d" stroke-width="3">
<animate attributeName="fill" values="#e7ebf5;#e7ebf5;#ffd166;#e7ebf5;#e7ebf5" keyTimes="0;0.7;0.78;0.95;1" dur="10s" repeatCount="indefinite"/></rect>
<text x="150" y="975" font-size="34" font-weight="700" fill="#14213d">4  KILL SWITCH</text>
<text x="150" y="1020" font-size="24" fill="#14213d">CrowdStrike AI Kill Switch ends rogue agents</text>
<text x="150" y="1058" font-size="22" fill="#44506b">Terminates the agent and cuts network access</text>
</g>

<!-- travelling token -->
<circle r="20" fill="#e63946" stroke="#14213d" stroke-width="3">
<animateMotion dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.3;0.45;0.55;0.7;0.8;0.9;1" keyPoints="0;0.0;0.17;0.17;0.34;0.34;0.5;0.8;1" calcMode="linear"
 path="M540 240 V365 V495 V625 V755 V885 V1010 H990 V240 H540"/>
</circle>

<!-- thesis -->
<rect x="60" y="1150" width="960" height="110" rx="18" fill="#14213d"/>
<text x="540" y="1196" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Policy sets the rules. The trace proves them.</text>
<text x="540" y="1238" font-size="26" fill="#ffd166" text-anchor="middle">Security vendors are now buying the trace layer.</text>
<text x="540" y="1312" font-size="24" fill="#44506b" text-anchor="middle">Emerging Things · Rahul Adokar</text>
</svg>
