<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Helvetica,Arial,sans-serif"><rect width="1080" height="1350" fill="#F7F5F0"/><text x="60" y="100" font-size="52" font-weight="700" fill="#1a1a1a">Who writes the agent's</text><text x="60" y="162" font-size="52" font-weight="700" fill="#1a1a1a">audit record?</text><text x="60" y="210" font-size="24" fill="#555">Microsoft lays the pipe at Ignite, Nov 17, 2026</text><line x1="110" y1="300" x2="110" y2="920" stroke="#bbb" stroke-width="6"/><rect x="160" y="250" width="600" height="170" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#FFE9A8;#fff;#fff" keyTimes="0;0.04;0.08;0.20;0.24;1" dur="10s" repeatCount="indefinite"/></rect><text x="190" y="288" font-size="22" fill="#555">1 · ANY AGENT</text><text x="190" y="334" font-size="34" font-weight="700" fill="#1a1a1a">Entra Agent ID</text><text x="190" y="370" font-size="22" fill="#1a1a1a">finds 60 local agent types (Claude</text><text x="190" y="398" font-size="22" fill="#1a1a1a">Code, Codex, Copilot CLI): preview</text><circle cx="110" cy="335.0" r="16" fill="#fff" stroke="#1a1a1a" stroke-width="4"><animate attributeName="fill" values="#fff;#fff;#D9480F;#D9480F;#fff" keyTimes="0;0.04;0.08;0.92;1" dur="10s" repeatCount="indefinite"/></circle><rect x="160" y="445" width="600" height="170" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#FFE9A8;#fff;#fff" keyTimes="0;0.24;0.28;0.40;0.44;1" dur="10s" repeatCount="indefinite"/></rect><text x="190" y="483" font-size="22" fill="#555">2 · TRACE</text><text x="190" y="529" font-size="34" font-weight="700" fill="#1a1a1a">OpenTelemetry GenAI</text><text x="190" y="565" font-size="22" fill="#1a1a1a">external-agent observability in</text><text x="190" y="593" font-size="22" fill="#1a1a1a">Foundry + Azure Monitor: GA</text><circle cx="110" cy="530.0" r="16" fill="#fff" stroke="#1a1a1a" stroke-width="4"><animate attributeName="fill" values="#fff;#fff;#D9480F;#D9480F;#fff" keyTimes="0;0.24;0.28;0.92;1" dur="10s" repeatCount="indefinite"/></circle><rect x="160" y="640" width="600" height="170" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#FFE9A8;#fff;#fff" keyTimes="0;0.44;0.48;0.60;0.64;1" dur="10s" repeatCount="indefinite"/></rect><text x="190" y="678" font-size="22" fill="#555">3 · EXPORT</text><text x="190" y="724" font-size="34" font-weight="700" fill="#1a1a1a">Agent 365 → Azure Monitor</text><text x="190" y="760" font-size="22" fill="#1a1a1a">agent traces sync into your own</text><text x="190" y="788" font-size="22" fill="#1a1a1a">App Insights: preview</text><circle cx="110" cy="725.0" r="16" fill="#fff" stroke="#1a1a1a" stroke-width="4"><animate attributeName="fill" values="#fff;#fff;#D9480F;#D9480F;#fff" keyTimes="0;0.44;0.48;0.92;1" dur="10s" repeatCount="indefinite"/></circle><rect x="160" y="835" width="600" height="170" rx="18" fill="#fff" stroke="#D9480F" stroke-width="3" stroke-dasharray="12 10"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#FFE9A8;#fff;#fff" keyTimes="0;0.64;0.68;0.80;0.84;1" dur="10s" repeatCount="indefinite"/></rect><text x="190" y="873" font-size="22" fill="#555">4 · AUDIT STANDARD</text><text x="190" y="919" font-size="34" font-weight="700" fill="#1a1a1a">AI Transparency Initiative</text><text x="190" y="955" font-size="22" fill="#1a1a1a">40+ orgs. Spec, log format,</text><text x="190" y="983" font-size="22" fill="#1a1a1a">deadline: none published yet</text><circle cx="110" cy="920.0" r="16" fill="#fff" stroke="#1a1a1a" stroke-width="4"><animate attributeName="fill" values="#fff;#fff;#D9480F;#D9480F;#fff" keyTimes="0;0.64;0.68;0.92;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="110" r="11" fill="#1a1a1a"><animate attributeName="cy" values="335.0;335.0;530.0;530.0;725.0;725.0;920.0;920.0;920.0" keyTimes="0;0.04;0.22;0.24;0.42;0.44;0.62;0.64;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.94;1" dur="10s" repeatCount="indefinite"/></circle><text x="712" y="935" font-size="64" font-weight="700" fill="#D9480F" text-anchor="middle" opacity="0">?<animate attributeName="opacity" values="0;0;1;0.3;1;0.3;1" keyTimes="0;0.66;0.70;0.76;0.82;0.88;1" dur="10s" repeatCount="indefinite"/></text><rect x="790" y="250" width="230" height="755" rx="18" fill="#fff" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="12 10"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#FFE9A8;#fff" keyTimes="0;0.80;0.84;0.96;1" dur="10s" repeatCount="indefinite"/></rect><text x="905" y="330" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="middle">ITSM /</text><text x="905" y="370" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="middle">CMDB</text><text x="905" y="410" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="middle">holds the</text><text x="905" y="450" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="middle">approval,</text><text x="905" y="490" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="middle">the change</text><text x="905" y="530" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="middle">and the</text><text x="905" y="570" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="middle">incident</text><text x="905" y="900" font-size="22" fill="#555" text-anchor="middle">not in</text><text x="905" y="928" font-size="22" fill="#555" text-anchor="middle">Microsoft's</text><text x="905" y="956" font-size="22" fill="#555" text-anchor="middle">pipe yet</text><line x1="760" y1="920.0" x2="790" y2="920.0" stroke="#D9480F" stroke-width="4" stroke-dasharray="6 6"/><rect x="60" y="1035" width="960" height="140" rx="18" fill="#1a1a1a"/><text x="90" y="1093" font-size="34" font-weight="700" fill="#F7F5F0">Microsoft is laying the agent-trace pipe.</text><text x="90" y="1143" font-size="34" font-weight="700" fill="#FFB27A">Whoever ships the log format owns the record.</text><text x="60" y="1225" font-size="20" fill="#555">Sources: Microsoft Source + Tech Community (Nov 17), Azure Monitor blog,</text><text x="60" y="1253" font-size="20" fill="#555">Tech Times (Nov 18). Availability labels are Microsoft's.</text><text x="60" y="1305" font-size="24" font-weight="700" fill="#1a1a1a">Emerging Things · Rahul Adokar</text></svg>