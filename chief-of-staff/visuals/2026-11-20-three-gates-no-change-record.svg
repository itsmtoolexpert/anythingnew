<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Helvetica, Arial, sans-serif">
<style>
  .bg{fill:#FAF8F3}
  .t{fill:#14161A}
  .m{fill:#4A4F57}
  .box{fill:#FFFFFF;stroke:#C9CDD3;stroke-width:2}
  .gate{fill:#FFFFFF;stroke:#C9CDD3;stroke-width:2}
  .itsm{fill:#FFF4E5;stroke:#C2410C;stroke-width:3;stroke-dasharray:10 8}
  .link{stroke:#C2410C;stroke-width:3;stroke-dasharray:8 8;fill:none;opacity:.35}
  .tok{fill:#1D4ED8}
  @keyframes t1{0%{transform:translateX(0);opacity:1}25%{transform:translateX(680px);opacity:1}27%,100%{transform:translateX(680px);opacity:0}}
  @keyframes t2{0%,25%{transform:translateX(0);opacity:0}26%{opacity:1}50%{transform:translateX(680px);opacity:1}52%,100%{transform:translateX(680px);opacity:0}}
  @keyframes t3{0%,50%{transform:translateX(0);opacity:0}51%{opacity:1}75%{transform:translateX(680px);opacity:1}77%,100%{transform:translateX(680px);opacity:0}}
  #k1{animation:t1 10s linear infinite}
  #k2{animation:t2 10s linear infinite}
  #k3{animation:t3 10s linear infinite}
  @keyframes g1{0%,8%{stroke:#C9CDD3;fill:#FFFFFF}10%,18%{stroke:#15803D;fill:#ECFDF3}20%,100%{stroke:#C9CDD3;fill:#FFFFFF}}
  @keyframes g2{0%,33%{stroke:#C9CDD3;fill:#FFFFFF}35%,43%{stroke:#15803D;fill:#ECFDF3}45%,100%{stroke:#C9CDD3;fill:#FFFFFF}}
  @keyframes g3{0%,58%{stroke:#C9CDD3;fill:#FFFFFF}60%,68%{stroke:#15803D;fill:#ECFDF3}70%,100%{stroke:#C9CDD3;fill:#FFFFFF}}
  #gb1{animation:g1 10s linear infinite}
  #gb2{animation:g2 10s linear infinite}
  #gb3{animation:g3 10s linear infinite}
  @keyframes lk{0%,75%{opacity:.35;stroke-dashoffset:0}78%,97%{opacity:1;stroke-dashoffset:-64}100%{opacity:.35}}
  .link{animation:lk 10s linear infinite}
  @keyframes q{0%,76%{opacity:0}80%,96%{opacity:1}100%{opacity:0}}
  .q{animation:q 10s linear infinite;fill:#C2410C;font-weight:700}
  @keyframes ib{0%,76%{fill:#FFF4E5}82%,94%{fill:#FFE4C7}100%{fill:#FFF4E5}}
  .itsm{animation:ib 10s linear infinite}
</style>
<rect class="bg" width="1080" height="1350"/>
<text class="t" x="50" y="100" font-size="50" font-weight="700">Three new human gates.</text>
<text class="t" x="50" y="158" font-size="50" font-weight="700">Zero change records.</text>
<text class="m" x="50" y="200" font-size="22">Agent-ops launches, Nov 17–19, 2026: where the approval actually lives</text>

<text class="m" x="200" y="248" font-size="21" font-weight="700" text-anchor="middle">AGENT PROPOSES</text>
<text class="m" x="540" y="248" font-size="21" font-weight="700" text-anchor="middle">HUMAN GATE</text>
<text class="m" x="880" y="248" font-size="21" font-weight="700" text-anchor="middle">THE “YES” IS KEPT IN</text>

<!-- Lane 1 -->
<text class="t" x="50" y="292" font-size="26" font-weight="700">Databricks Genie ZeroOps <tspan class="m" font-weight="400" font-size="21">· public beta · Nov 19</tspan></text>
<rect class="box" x="50" y="308" width="300" height="110" rx="14"/>
<text class="t" x="200" y="355" font-size="22" text-anchor="middle">Watches jobs, pipelines,</text>
<text class="t" x="200" y="385" font-size="22" text-anchor="middle">tables; drafts a fix</text>
<rect id="gb1" class="gate" x="390" y="308" width="300" height="110" rx="14"/>
<text class="t" x="540" y="355" font-size="22" text-anchor="middle">Pull request on a new</text>
<text class="t" x="540" y="385" font-size="22" text-anchor="middle">branch; you approve</text>
<rect class="box" x="730" y="308" width="300" height="110" rx="14"/>
<text class="t" x="880" y="355" font-size="22" text-anchor="middle">Git history</text>
<text class="t" x="880" y="385" font-size="22" text-anchor="middle">(the merged PR)</text>
<circle id="k1" class="tok" cx="200" cy="430" r="12"/>

<!-- Lane 2 -->
<text class="t" x="50" y="488" font-size="26" font-weight="700">LangSmith Tool Gateway <tspan class="m" font-weight="400" font-size="21">· public beta · Nov 19</tspan></text>
<rect class="box" x="50" y="504" width="300" height="110" rx="14"/>
<text class="t" x="200" y="551" font-size="22" text-anchor="middle">Agent calls a tool with</text>
<text class="t" x="200" y="581" font-size="22" text-anchor="middle">stored credentials</text>
<rect id="gb2" class="gate" x="390" y="504" width="300" height="110" rx="14"/>
<text class="t" x="540" y="551" font-size="22" text-anchor="middle">Approval policy at the</text>
<text class="t" x="540" y="581" font-size="22" text-anchor="middle">sensitive call</text>
<rect class="box" x="730" y="504" width="300" height="110" rx="14"/>
<text class="t" x="880" y="551" font-size="22" text-anchor="middle">LangSmith trace:</text>
<text class="t" x="880" y="581" font-size="22" text-anchor="middle">caller, tool, outcome</text>
<circle id="k2" class="tok" cx="200" cy="626" r="12"/>

<!-- Lane 3 -->
<text class="t" x="50" y="684" font-size="26" font-weight="700">Resolve AI SRE-1 + Primary On-call <tspan class="m" font-weight="400" font-size="21">· Nov 18</tspan></text>
<rect class="box" x="50" y="700" width="300" height="110" rx="14"/>
<text class="t" x="200" y="747" font-size="22" text-anchor="middle">27B open-weight model</text>
<text class="t" x="200" y="777" font-size="22" text-anchor="middle">investigates the page</text>
<rect id="gb3" class="gate" x="390" y="700" width="300" height="110" rx="14"/>
<text class="t" x="540" y="747" font-size="22" text-anchor="middle">Escalate to a human</text>
<text class="t" x="540" y="777" font-size="22" text-anchor="middle">only when needed</text>
<rect class="box" x="730" y="700" width="300" height="110" rx="14"/>
<text class="t" x="880" y="747" font-size="22" text-anchor="middle">Resolve itself; up to 80%</text>
<text class="t" x="880" y="777" font-size="22" text-anchor="middle">of pages never escalate*</text>
<circle id="k3" class="tok" cx="200" cy="822" r="12"/>

<!-- dashed links to ITSM -->
<path class="link" d="M1030 363 H1056 V880"/>
<path class="link" d="M1030 559 H1056"/>
<path class="link" d="M1030 755 H1056"/>
<text class="q" x="1000" y="470" font-size="40" text-anchor="middle">?</text>
<text class="q" x="1000" y="666" font-size="40" text-anchor="middle">?</text>
<text class="q" x="1000" y="862" font-size="40" text-anchor="middle">?</text>

<!-- ITSM box -->
<rect class="itsm" x="50" y="880" width="1006" height="170" rx="16"/>
<text class="t" x="80" y="930" font-size="32" font-weight="700">ITSM change / incident record</text>
<text class="t" x="80" y="972" font-size="22">Only link on stage: ServiceNow + Azure Monitor demo (Ignite, Nov 17):</text>
<text class="t" x="80" y="1004" font-size="22">Azure alert → ServiceNow AIOps/ITSM incident, fix under human control.</text>
<text class="m" x="80" y="1034" font-size="20">None of the three launches above mentions writing back to ITSM.</text>

<!-- thesis -->
<text class="t" x="540" y="1120" font-size="32" font-weight="700" text-anchor="middle">The human “yes” is now a product feature.</text>
<text class="t" x="540" y="1162" font-size="32" font-weight="700" text-anchor="middle">It's landing everywhere except change management.</text>

<text class="m" x="50" y="1232" font-size="20">*Resolve AI's own claim (company-run benchmarks). Sources: Databricks blog; LangChain blog;</text>
<text class="m" x="50" y="1260" font-size="20">ResolveAI release via Business Wire (Nov 18); Technology Record (Ignite coverage).</text>
<text class="t" x="50" y="1312" font-size="22" font-weight="700">Emerging Things · Rahul Adokar</text>
</svg>
