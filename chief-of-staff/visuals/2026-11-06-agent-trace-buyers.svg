<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Helvetica,Arial,sans-serif"><rect width="1080" height="1350" fill="#F7F5F0"/><text x="60" y="110" font-size="52" font-weight="700" fill="#1a1a1a">Security and infra vendors</text><text x="60" y="172" font-size="52" font-weight="700" fill="#1a1a1a">are buying the agent trace</text><rect x="60" y="260" width="960" height="200" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#fff;#fff" keyTimes="0;0.00;0.05;0.22;1" dur="10s" repeatCount="indefinite"/></rect><text x="90" y="310" font-size="26" fill="#555">NOV 2025</text><text x="90" y="365" font-size="44" font-weight="700" fill="#1a1a1a">Palo Alto Networks</text><text x="90" y="408" font-size="28" fill="#1a1a1a">acquires Chronosphere</text><text x="90" y="444" font-size="22" fill="#555">$3.35B (reported)</text><path d="M540 462 v46" stroke="#555" stroke-width="4"/><rect x="60" y="510" width="960" height="200" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#fff;#fff" keyTimes="0;0.25;0.30;0.47;1" dur="10s" repeatCount="indefinite"/></rect><text x="90" y="560" font-size="26" fill="#555">APR 2026</text><text x="90" y="615" font-size="44" font-weight="700" fill="#1a1a1a">Cisco / Splunk</text><text x="90" y="658" font-size="28" fill="#1a1a1a">to acquire Galileo</text><text x="90" y="694" font-size="22" fill="#555">agent observability</text><path d="M540 712 v46" stroke="#555" stroke-width="4"/><rect x="60" y="760" width="960" height="200" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#fff;#fff" keyTimes="0;0.50;0.55;0.72;1" dur="10s" repeatCount="indefinite"/></rect><text x="90" y="810" font-size="26" fill="#555">NOV 3 2026</text><text x="90" y="865" font-size="44" font-weight="700" fill="#1a1a1a">CrowdStrike</text><text x="90" y="908" font-size="28" fill="#1a1a1a">to acquire Fiddler AI</text><text x="90" y="944" font-size="22" fill="#555">~$495M w/ Dreadnode (WSJ)</text><rect x="60" y="1010" width="960" height="110" rx="18" fill="#1a1a1a"/><text x="90" y="1080" font-size="36" font-weight="700" fill="#F7F5F0">Prize: the record of what agents did</text><circle r="16" fill="#D9480F"><animate attributeName="cx" values="1000;1000;1000;1000" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="280;280;530;780;1060;1060;280" keyTimes="0;0.02;0.27;0.52;0.78;0.98;1" dur="10s" repeatCount="indefinite"/></circle><text x="60" y="1205" font-size="30" fill="#1a1a1a">Thesis: whoever holds the trace holds the evidence.</text><text x="60" y="1245" font-size="24" fill="#555">Sources linked in the Emerging Things brief, Nov 6 2026</text><text x="60" y="1310" font-size="24" fill="#555">Emerging Things · Rahul Adokar</text></svg>