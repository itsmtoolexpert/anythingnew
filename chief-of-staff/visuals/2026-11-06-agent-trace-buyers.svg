4" font-size="26" fill="#1a1a1a">acquires Arize (tracing + evals)</text><text x="560" y="714" font-size="22" fill="#555">$915M cash and stock</text><path d="M540 752 v16" stroke="#555" stroke-width="4"/><rect x="60" y="770" width="960" height="160" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#fff;#fff" keyTimes="0;0.66;0.71;0.85;1" dur="10s" repeatCount="indefinite"/></rect><text x="90" y="808" font-size="24" fill="#555">NOV 3 2026</text><text x="90" y="858" font-size="44" font-weight="700" fill="#1a1a1a">CrowdStrike</text><text x="90" y="894" font-size="26" fill="#1a1a1a">to acquire Fiddler AI</text><text x="560" y="894" font-size="22" fill="#555">~$495M w/ Dreadnode (WSJ)</text><rect x="60" y="960" width="960" height="110" rx="18" fill="#1a1a1a"/><text x="90" y="1028" font-size="36" font-weight="700" fill="#F7F5F0">Prize: the record of what agents did</text><circle r="16" fill="#D9480F"><animate attributeName="cx" values="1000;1000" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="250;250;430;610;790;1015;1015;250" keyTimes="0;0.02;0.22;0.44;0.66;0.85;0.98;1" dur="10s" repeatCount="indefinite"/></circle><text x="60" y="1150" font-size="30" fill="#1a1a1a">Thesis: whoever holds the trace holds the evidence.</text><text x="60" y="1195" font-size="24" fill="#555">Sources linked in the Emerging Things brief, Nov 9 2026</text><text x="60" y="1310" font-size="24" fill="#555">Emerging Things · Rahul Adokar · updated 2026-11-09</text></svg>