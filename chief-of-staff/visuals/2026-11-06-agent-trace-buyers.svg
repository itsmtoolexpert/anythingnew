<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Helvetica,Arial,sans-serif"><rect width="1080" height="1350" fill="#F7F5F0"/><text x="60" y="104" font-size="52" font-weight="700" fill="#1a1a1a">Five deals, one asset:</text><text x="60" y="164" font-size="52" font-weight="700" fill="#1a1a1a">the AI agent trace</text><rect x="60" y="210" width="960" height="148" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#fff;#fff" keyTimes="0;0.02;0.06;0.17;1" dur="10s" repeatCount="indefinite"/></rect><text x="90" y="246" font-size="24" fill="#555" font-weight="400">NOV 2025</text><text x="90" y="296" font-size="44" font-weight="700" fill="#1a1a1a">Palo Alto Networks</text><text x="90" y="334" font-size="26" fill="#1a1a1a">acquires Chronosphere</text><text x="560" y="334" font-size="22" fill="#555">$3.35B (reported)</text><path d="M540 360 v14" stroke="#555" stroke-width="4"/><rect x="60" y="376" width="960" height="148" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#fff;#fff" keyTimes="0;0.18;0.22;0.33;1" dur="10s" repeatCount="indefinite"/></rect><text x="90" y="412" font-size="24" fill="#555" font-weight="400">APR 2026</text><text x="90" y="462" font-size="44" font-weight="700" fill="#1a1a1a">Cisco / Splunk</text><text x="90" y="500" font-size="26" fill="#1a1a1a">to acquire Galileo</text><text x="560" y="500" font-size="22" fill="#555">agent observability</text><path d="M540 526 v14" stroke="#555" stroke-width="4"/><rect x="60" y="542" width="960" height="148" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#fff;#fff" keyTimes="0;0.34;0.38;0.49;1" dur="10s" repeatCount="indefinite"/></rect><text x="90" y="578" font-size="24" fill="#555" font-weight="400">AUG 2026 · CLOSED OCT 1</text><text x="90" y="628" font-size="44" font-weight="700" fill="#1a1a1a">Dynatrace</text><text x="90" y="666" font-size="26" fill="#1a1a1a">acquires Arize (tracing + evals)</text><text x="560" y="666" font-size="22" fill="#555">$915M cash and stock</text><path d="M540 692 v14" stroke="#555" stroke-width="4"/><rect x="60" y="708" width="960" height="148" rx="18" fill="#fff" stroke="#999" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#fff;#fff" keyTimes="0;0.50;0.54;0.65;1" dur="10s" repeatCount="indefinite"/></rect><text x="90" y="744" font-size="24" fill="#555" font-weight="400">NOV 3 2026</text><text x="90" y="794" font-size="44" font-weight="700" fill="#1a1a1a">CrowdStrike</text><text x="90" y="832" font-size="26" fill="#1a1a1a">to acquire Fiddler AI</text><text x="560" y="832" font-size="22" fill="#555">~$495M w/ Dreadnode (WSJ)</text><path d="M540 858 v14" stroke="#555" stroke-width="4"/><rect x="60" y="874" width="960" height="148" rx="18" fill="#fff" stroke="#D9480F" stroke-width="3"><animate attributeName="fill" values="#fff;#fff;#FFE9A8;#fff;#fff" keyTimes="0;0.66;0.70;0.81;1" dur="10s" repeatCount="indefinite"/></rect><text x="90" y="910" font-size="24" fill="#D9480F" font-weight="700">NOV 19 2026 · NEW</text><text x="90" y="960" font-size="44" font-weight="700" fill="#1a1a1a">Elastic</text><text x="90" y="998" font-size="26" fill="#1a1a1a">to acquire HoneyHive</text><text x="560" y="998" font-size="22" fill="#555">tracing + evals; terms not disclosed</text><rect x="60" y="1044" width="960" height="100" rx="18" fill="#1a1a1a"><animate attributeName="fill" values="#1a1a1a;#1a1a1a;#D9480F;#1a1a1a" keyTimes="0;0.84;0.9;1" dur="10s" repeatCount="indefinite"/></rect><text x="90" y="1106" font-size="36" font-weight="700" fill="#F7F5F0">Prize: the record of what agents did</text><circle r="16" fill="#D9480F"><animate attributeName="cx" values="1000;1000" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="230;230;396;562;728;894;1094;1094;230" keyTimes="0;0.02;0.18;0.34;0.50;0.66;0.84;0.98;1" dur="10s" repeatCount="indefinite"/></circle><text x="60" y="1192" font-size="30" font-weight="700" fill="#1a1a1a">Thesis: agent tracing is now a feature you get.</text><text x="60" y="1232" font-size="30" fill="#1a1a1a">The scarce asset is the join to the outcome.</text><text x="60" y="1268" font-size="22" fill="#555">Sources linked in the Emerging Things brief, Nov 23 2026</text><text x="60" y="1310" font-size="24" fill="#555">Emerging Things · Rahul Adokar · updated 2026-11-23</text></svg>